<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wall — Ralph & Shaira Wedding</title>
    <link rel="icon" type="image/png" href="images/monogram.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(180deg, #f5f7fa 0%, #e8ecf1 100%);
            color: #2c3e50;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .wall-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(107, 154, 196, 0.15);
            padding: 20px 30px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        }

        .wall-header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .wall-title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .wall-title h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #6B9AC4;
            line-height: 1;
        }

        .wall-title p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8E8E8E;
            margin-top: 4px;
        }

        .wall-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #4CAF50;
            font-weight: 600;
        }

        .wall-status .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            animation: livePulse 1.5s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.5); }
            50% { opacity: 0.7; transform: scale(1.2); box-shadow: 0 0 0 8px rgba(76, 175, 80, 0); }
        }

        .upload-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #6B9AC4, #5a89b3);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(107, 154, 196, 0.35);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 154, 196, 0.45);
        }

        /* ===== STATS BAR ===== */
        .wall-stats {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 10px rgba(107, 154, 196, 0.08);
            border: 1px solid rgba(107, 154, 196, 0.1);
        }

        .stat-pill-value {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #6B9AC4;
            font-weight: 600;
        }

        .stat-pill-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8E8E8E;
        }

        /* ===== HEART REACTION BUTTON ===== */
        .heart-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 25px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 3;
            backdrop-filter: blur(10px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .heart-btn:hover {
            transform: scale(1.1);
            background: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .heart-btn svg {
            color: #8E8E8E;
            fill: none;
            transition: all 0.3s;
            width: 16px;
            height: 16px;
        }

        .heart-btn.reacted svg {
            color: #e74c3c;
            fill: #e74c3c;
            animation: heartBeat 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .heart-count {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: #2c3e50;
            min-width: 12px;
            text-align: center;
        }

        .heart-btn.reacted .heart-count {
            color: #e74c3c;
        }

        /* Floating hearts animation */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 24px;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        /* ===== DOWNLOAD BUTTON ===== */
        .download-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 3;
            opacity: 0;
            backdrop-filter: blur(10px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            color: #6B9AC4;
        }

        .photo-item:hover .download-btn {
            opacity: 1;
        }

        .download-btn:hover {
            background: #6B9AC4;
            color: #fff;
            transform: scale(1.1);
        }

        .download-btn.downloading {
            background: #4CAF50;
            color: #fff;
            animation: downloadPulse 0.6s ease;
        }

        @keyframes downloadPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Lightbox action buttons */
        .lightbox-actions {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 6002; /* Higher than lightbox */
            pointer-events: auto;
        }

        .lightbox-action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 10px 18px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .lightbox-action-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .lightbox-action-btn:active {
            transform: translateY(0);
        }

        .lightbox-action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .lightbox-action-btn.heart-active {
            background: rgba(231, 76, 60, 0.25);
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .lightbox-action-btn.heart-active svg {
            fill: #e74c3c;
            animation: heartBeat 0.6s ease;
        }

        .lightbox-close {
            z-index: 6002;
            pointer-events: auto;
        }

        /* Ensure lightbox image doesn't block button clicks */
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: auto;
        }

        .lightbox-info {
            pointer-events: auto;
            z-index: 6001;
        }

        /* Mobile: always show download button */
        @media (max-width: 768px) {
            .download-btn {
                opacity: 1;
                width: 30px;
                height: 30px;
            }

            .download-btn svg {
                width: 14px;
                height: 14px;
            }

            .heart-btn {
                padding: 4px 10px;
            }

            .heart-btn svg {
                width: 14px;
                height: 14px;
            }

            .heart-count {
                font-size: 0.65rem;
            }

            .lightbox-action-btn {
                padding: 6px 12px;
                font-size: 0.65rem;
            }
        }

        /* ===== PHOTO GALLERY ===== */
        .wall-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        @media (max-width: 768px) {
            .wall-container {
                padding: 20px 12px 50px;
            }
        }

        @media (max-width: 480px) {
            .wall-container {
                padding: 15px 10px 40px;
            }
        }
        /* ===== PHOTO GRID ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #e8ecf1, #d5dce5);
            box-shadow: 0 6px 20px rgba(107, 154, 196, 0.12);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            animation: photoReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes photoReveal {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .photo-item.new-photo {
            animation: newPhotoReveal 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes newPhotoReveal {
            0% { opacity: 0; transform: scale(0.5) rotate(-5deg); box-shadow: 0 0 30px rgba(107, 154, 196, 0.5); }
            60% { transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        .photo-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(107, 154, 196, 0.25);
        }

        /* IMAGE FILLS THE ENTIRE ITEM */
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .photo-item:hover img {
            transform: scale(1.08);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(44, 62, 80, 0.85) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .photo-caption {
            font-family: 'Cormorant Garamond', serif;
            color: #fff;
            font-size: 0.9rem;
            font-style: italic;
            line-height: 1.3;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .photo-guest {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #A7C7E7;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
        }

        /* ===== RESPONSIVE — 2-3 COLUMNS ON MOBILE ===== */
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .photo-item {
                border-radius: 8px;
            }

            .photo-overlay {
                padding: 8px;
                /* Always show on mobile since no hover */
                opacity: 1;
                background: linear-gradient(180deg, transparent 60%, rgba(44, 62, 80, 0.75) 100%);
            }

            .photo-caption {
                font-size: 0.7rem;
                -webkit-line-clamp: 1;
            }

            .photo-guest {
                font-size: 0.5rem;
                letter-spacing: 1px;
            }

            .photo-time {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            .photo-item {
                border-radius: 8px;
            }

            .photo-overlay {
                padding: 8px 10px;
            }

            .photo-caption {
                font-size: 0.75rem;
                -webkit-line-clamp: 2;
            }

            .photo-guest {
                font-size: 0.55rem;
            }
        }

        /* Very small phones - keep 2 columns */
        @media (max-width: 360px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #A7C7E7, #6B9AC4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: #fff;
            box-shadow: 0 8px 30px rgba(107, 154, 196, 0.3);
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #6B9AC4;
            margin-bottom: 8px;
        }

        .empty-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: #7E9BB5;
            font-style: italic;
        }

        /* ===== LOADING ===== */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(107, 154, 196, 0.15);
            border-top-color: #6B9AC4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== REFRESH INDICATOR ===== */
        .refresh-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(107, 154, 196, 0.1);
            border: 1px solid rgba(107, 154, 196, 0.2);
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6B9AC4;
            font-weight: 600;
        }

        .refresh-indicator svg {
            animation: refreshRotate 60s linear infinite;
        }

        @keyframes refreshRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-indicator.refreshing svg {
            animation: refreshFast 0.8s linear infinite;
        }

        @keyframes refreshFast {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-countdown {
            color: #6B9AC4;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .refresh-indicator {
                padding: 6px 12px;
                font-size: 0.55rem;
            }
            .refresh-indicator svg {
                width: 12px;
                height: 12px;
            }
        }

        /* ===== UPLOAD MODAL ===== */
        .upload-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 5000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .upload-modal.active {
            display: flex;
        }

        .upload-content {
            background: #fff;
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalSlideIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .upload-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .upload-header h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #6B9AC4;
            margin-bottom: 5px;
        }

        .upload-header p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8E8E8E;
        }

        /* File Drop Zone */
        .drop-zone {
            border: 2px dashed rgba(107, 154, 196, 0.3);
            border-radius: 15px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #f5f7fa, #e8ecf1);
            margin-bottom: 20px;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #6B9AC4;
            background: linear-gradient(135deg, #eaf2f9, #dce8f2);
        }

        .drop-zone-icon {
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: #6B9AC4;
            box-shadow: 0 4px 15px rgba(107, 154, 196, 0.15);
        }

        .drop-zone-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .drop-zone-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: #8E8E8E;
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Preview */
        .preview-container {
            display: none;
            margin-bottom: 20px;
        }

        .preview-container.active {
            display: block;
        }

        .preview-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .change-photo-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(107, 154, 196, 0.3);
            border-radius: 8px;
            color: #6B9AC4;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .change-photo-btn:hover {
            background: rgba(107, 154, 196, 0.08);
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8E8E8E;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid rgba(107, 154, 196, 0.2);
            border-radius: 10px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: #2c3e50;
            background: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #6B9AC4;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
            font-style: italic;
        }

        /* Modal Actions */
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: #f5f7fa;
            color: #7E9BB5;
        }

        .btn-cancel:hover {
            background: #e8ecf1;
        }

        .btn-submit {
            background: linear-gradient(135deg, #6B9AC4, #5a89b3);
            color: #fff;
            box-shadow: 0 4px 15px rgba(107, 154, 196, 0.35);
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #5a89b3, #4a7da8);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 6000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            padding: 12px 25px;
            border-radius: 25px;
            color: #fff;
            text-align: center;
            max-width: 80vw;
        }

        .lightbox-caption {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            font-style: italic;
            margin-bottom: 4px;
        }

        .lightbox-meta {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            color: #A7C7E7;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #6B9AC4, #5a89b3);
            color: #fff;
            padding: 14px 26px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(107, 154, 196, 0.4);
            z-index: 7000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: linear-gradient(135deg, #c86464, #b55555); }
        .toast.success { background: linear-gradient(135deg, #4CAF50, #45a049); }

        /* Upload Progress */
        .upload-progress {
            display: none;
            margin-top: 15px;
            background: rgba(107, 154, 196, 0.08);
            padding: 12px 15px;
            border-radius: 8px;
        }

        .upload-progress.active { display: block; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(107, 154, 196, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #A7C7E7, #6B9AC4);
            animation: progressAnim 2s ease-in-out infinite;
        }

        @keyframes progressAnim {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: #6B9AC4;
            margin-top: 8px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .wall-header { padding: 15px 20px; }
            .wall-title h1 { font-size: 1.8rem; }
            .upload-btn { padding: 10px 18px; font-size: 0.6rem; }
            .stat-pill { padding: 8px 15px; }
            .stat-pill-value { font-size: 1.1rem; }
        }

        @media (max-width: 480px) {
            .wall-header-inner { justify-content: center; text-align: center; }
            .wall-status { display: none; }
            .upload-content { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="wall-header">
        <div class="wall-header-inner">
            <div class="wall-title-group">
                <div class="wall-title">
                    <h1>Live Wall</h1>
                    <p>Ralph &amp; Shaira</p>
                </div>
                <div class="wall-status">
                    <div class="pulse-dot"></div>
                    <span>Live</span>
                </div>
            </div>
            <button class="upload-btn" onclick="openUploadModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Share Photo
            </button>
        </div>
    </header>

    <!-- Stats -->
    <div class="wall-stats">
        <div class="stat-pill">
            <span class="stat-pill-value" id="photoCount">0</span>
            <span class="stat-pill-label">Photos</span>
        </div>
        <div class="stat-pill">
            <span class="stat-pill-value" id="guestCount">0</span>
            <span class="stat-pill-label">Guests Sharing</span>
        </div>
        <div class="stat-pill">
            <span class="stat-pill-value" id="lastUpdate">—</span>
            <span class="stat-pill-label">Last Update</span>
        </div>

        <!-- Refresh Indicator -->
        <div class="refresh-indicator" id="refreshIndicator" title="Auto-refresh every minute">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
            <span>Refreshing in <span class="refresh-countdown" id="refreshCountdown">60</span>s</span>
        </div>
    </div>

    <!-- Spotlight Section -->
    <div class="spotlight-section" id="spotlightSection" style="display:none;">
        <div class="spotlight-container">
            <div class="spotlight-header">
                <div class="spotlight-title-group">
                    <div class="spotlight-icon-wrap">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#2c3e50" stroke="none">
                            <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7-6.3-4.6L5.7 21l2.3-7L2 9.4h7.6z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="spotlight-title">Spotlight</h3>
                        <div class="spotlight-subtitle">Most Loved Photos</div>
                    </div>
                </div>
                <div class="spotlight-count" id="spotlightCount"></div>
            </div>
            <div class="spotlight-grid" id="spotlightGrid"></div>
        </div>
    </div>

    <!-- Gallery -->
    <div class="wall-container">
        <div class="photo-grid" id="photoGrid">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p style="color: #7E9BB5; font-style: italic;">Loading photos...</p>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="upload-modal" id="uploadModal">
        <div class="upload-content">
            <div class="upload-header">
                <h2>Share Your Moment</h2>
                <p>Add to Our Live Wall</p>
            </div>

            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                <div class="drop-zone-icon">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </div>
                <p class="drop-zone-text">Click or drop a photo here</p>
                <p class="drop-zone-sub">JPG, PNG or WEBP · Max 10MB</p>
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="previewImage" class="preview-image" alt="Preview">
                <button class="change-photo-btn" onclick="clearPreview()">Change Photo</button>
            </div>

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="guestName" placeholder="e.g. Maria Santos" maxlength="30" required>
            </div>

            <div class="form-group">
                <label>Caption (Optional)</label>
                <textarea id="captionText" placeholder="Share your thoughts..." maxlength="80"></textarea>
            </div>

            <div class="upload-progress" id="uploadProgress">
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <p class="progress-text">Uploading photo...</p>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeUploadModal()">Cancel</button>
                <button class="btn-submit" id="submitBtn" onclick="uploadPhoto()">Share Photo</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>

        <div class="lightbox-actions" onclick="event.stopPropagation()">
            <button class="lightbox-action-btn" id="lightboxHeartBtn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                </svg>
                <span id="lightboxHeartCount">0</span>
            </button>
            <button class="lightbox-action-btn" id="lightboxDownloadBtn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download
            </button>
        </div>

        <img id="lightboxImg" alt="Photo" onclick="event.stopPropagation()">

        <div class="lightbox-info" onclick="event.stopPropagation()">
            <div class="lightbox-caption" id="lightboxCaption"></div>
            <div class="lightbox-meta" id="lightboxMeta"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ⚠️ CONFIGURATION
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-Es0WJ0DcudZcqVKV_PTt-GeeB7HrdcD1joP_YpBD0hNgY6-U5jKrGr66xABNngP3/exec';
        const REFRESH_INTERVAL = 60000; // 60 seconds

        var allPhotos = [];
        var seenPhotoIds = new Set();
        var currentFile = null;
        var isFirstLoad = true;
        var refreshTimer = null;

        // ===== GENERATE UNIQUE REACTOR ID =====
        function getReactorId() {
            var id = localStorage.getItem('livewall_reactor_id');
            if (!id) {
                id = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('livewall_reactor_id', id);
            }
            return id;
        }

        var REACTOR_ID = getReactorId();
        var currentLightboxPhoto = null;

        // ===== UPDATE LOAD PHOTOS TO INCLUDE REACTOR ID =====
        function loadPhotos() {
            var url = GOOGLE_SCRIPT_URL + '?action=photos&reactorId=' + REACTOR_ID + '&t=' + Date.now();

            fetch(url, { method: 'GET', redirect: 'follow' })
                .then(function(response) { return response.text(); })
                .then(function(text) {
                    var result;
                    try {
                        result = JSON.parse(text);
                    } catch (e) {
                        throw new Error('Invalid response');
                    }

                    if (result.status === 'success') {
                        var newPhotos = result.photos || [];
                        var newIds = new Set();
                        var justAdded = [];

                        newPhotos.forEach(function(p) {
                            newIds.add(p.id);
                            if (!seenPhotoIds.has(p.id) && !isFirstLoad) {
                                justAdded.push(p.id);
                            }
                        });

                        allPhotos = newPhotos;
                        seenPhotoIds = newIds;

                        renderPhotos(justAdded);
                        updateStats();

                        if (justAdded.length > 0 && !isFirstLoad) {
                            showToast('📸 New photo added!', 'success');
                        }

                        isFirstLoad = false;
                    }
                })
                .catch(function(err) {
                    console.error('Load error:', err);
                });
        }


        // ===== UPDATE RENDER PHOTOS TO INCLUDE HEART & DOWNLOAD BUTTONS =====
        function renderPhotos(newIds) {
            var grid = document.getElementById('photoGrid');

            if (allPhotos.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state">' +
                        '<div class="empty-icon">' +
                            '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
                                '<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>' +
                                '<circle cx="12" cy="13" r="4"/>' +
                            '</svg>' +
                        '</div>' +
                        '<h3 class="empty-title">Be the first to share</h3>' +
                        '<p class="empty-subtitle">Photos from our special day will appear here</p>' +
                    '</div>';
                return;
            }

            newIds = newIds || [];
            var html = allPhotos.map(function(photo) {
                var isNew = newIds.indexOf(photo.id) !== -1;
                var reactedClass = photo.userReacted ? 'reacted' : '';

                return '<div class="photo-item ' + (isNew ? 'new-photo' : '') + '" data-photo-id="' + photo.id + '">' +
                    '<img src="' + photo.url + '" alt="' + escapeHTML(photo.caption || 'Photo') + '" loading="lazy" onerror="this.parentNode.style.display=\'none\'" onclick="openLightbox(\'' + photo.id + '\')">' +

                    '<button class="download-btn" onclick="downloadPhoto(\'' + photo.id + '\', \'' + escapeHTML(photo.guestName) + '\', event)" title="Download">' +
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                            '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>' +
                            '<polyline points="7 10 12 15 17 10"/>' +
                            '<line x1="12" y1="15" x2="12" y2="3"/>' +
                        '</svg>' +
                    '</button>' +

                    '<button class="heart-btn ' + reactedClass + '" onclick="toggleReaction(\'' + photo.id + '\', event)" title="React">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                            '<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>' +
                        '</svg>' +
                        '<span class="heart-count">' + photo.reactions + '</span>' +
                    '</button>' +

                    '<div class="photo-overlay" onclick="openLightbox(\'' + photo.id + '\')">' +
                        (photo.caption ? '<p class="photo-caption">' + escapeHTML(photo.caption) + '</p>' : '') +
                        '<p class="photo-guest">📸 ' + escapeHTML(photo.guestName) + '</p>' +
                        '<p class="photo-time">' + formatTimeAgo(photo.timestamp) + '</p>' +
                    '</div>' +
                '</div>';
            }).join('');

            grid.innerHTML = html;
        }

        // ===== TOGGLE REACTION =====
        function toggleReaction(photoId, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            var photo = allPhotos.find(function(p) { return p.id === photoId; });
            if (!photo) return;

            var wasReacted = photo.userReacted;
            var newAction = wasReacted ? 'remove' : 'add';

            // Optimistic UI update
            photo.userReacted = !wasReacted;
            photo.reactions += wasReacted ? -1 : 1;

            // Update all instances of this photo (grid + spotlight)
            updatePhotoUI(photoId, photo);

            // Show floating heart animation
            if (!wasReacted && event) {
                showFloatingHeart(event.clientX, event.clientY);
            }

            // Send to server
            var payload = {
                action: 'react',
                photoId: photoId,
                reactorId: REACTOR_ID,
                reactionAction: newAction
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            }).catch(function(err) {
                // Rollback on error
                photo.userReacted = wasReacted;
                photo.reactions += wasReacted ? 1 : -1;
                updatePhotoUI(photoId, photo);
                showToast('Failed to react', 'error');
            });
        }

        function updatePhotoUI(photoId, photo) {
            // Update all heart buttons for this photo
            document.querySelectorAll('[data-photo-id="' + photoId + '"] .heart-btn').forEach(function(btn) {
                if (photo.userReacted) {
                    btn.classList.add('reacted');
                } else {
                    btn.classList.remove('reacted');
                }
                var countEl = btn.querySelector('.heart-count');
                if (countEl) countEl.textContent = photo.reactions;
            });

            // Update lightbox if open with same photo
            if (currentLightboxPhoto && currentLightboxPhoto.id === photoId) {
                currentLightboxPhoto = photo;
                var lightboxBtn = document.getElementById('lightboxHeartBtn');
                var lightboxCount = document.getElementById('lightboxHeartCount');
                if (lightboxBtn) {
                    lightboxBtn.classList.toggle('heart-active', photo.userReacted);
                }
                if (lightboxCount) {
                    lightboxCount.textContent = photo.reactions;
                }
            }
        }

        function showFloatingHeart(x, y) {
            var heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '❤️';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            document.body.appendChild(heart);

            setTimeout(function() { heart.remove(); }, 1500);
        }

        // ===== DOWNLOAD PHOTO =====
        function downloadPhoto(photoId, guestName, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            var photo = allPhotos.find(function(p) { return p.id === photoId; });
            if (!photo) return;

            var btn = event ? event.currentTarget : null;
            if (btn) btn.classList.add('downloading');

            // Method 1: Try direct Google Drive download URL
            // This URL forces download instead of viewing
            var downloadUrl = 'https://drive.google.com/uc?export=download&id=' + photoId;
            var fileName = 'RalphAndShaira_' + (guestName || 'Photo').replace(/\s+/g, '_') + '_' + photoId.substr(0, 8) + '.jpg';

            // Create hidden link and trigger download
            var link = document.createElement('a');
            link.href = downloadUrl;
            link.download = fileName;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('✓ Opening download...', 'success');

            if (btn) {
                setTimeout(function() { btn.classList.remove('downloading'); }, 800);
            }
        }

        // ===== DOWNLOAD FROM LIGHTBOX (FIXED) =====
        function downloadPhotoFromLightbox(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            if (!currentLightboxPhoto) return;

            var btn = event ? event.currentTarget : null;
            if (btn) {
                var originalHTML = btn.innerHTML;
                btn.innerHTML =
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>' +
                        '<polyline points="22 4 12 14.01 9 11.01"/>' +
                    '</svg>' +
                    'Downloading...';
                btn.disabled = true;

                setTimeout(function() {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }, 2000);
            }

            var photoId = currentLightboxPhoto.id;
            var guestName = currentLightboxPhoto.guestName;

            var downloadUrl = 'https://drive.google.com/uc?export=download&id=' + photoId;
            var fileName = 'RalphAndShaira_' + (guestName || 'Photo').replace(/\s+/g, '_') + '_' + photoId.substr(0, 8) + '.jpg';

            var link = document.createElement('a');
            link.href = downloadUrl;
            link.download = fileName;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('✓ Opening download...', 'success');
        }

        function updateStats() {
            document.getElementById('photoCount').textContent = allPhotos.length;
            var uniqueGuests = new Set(allPhotos.map(function(p) { return p.guestName; }));
            document.getElementById('guestCount').textContent = uniqueGuests.size;

            if (allPhotos.length > 0) {
                document.getElementById('lastUpdate').textContent = formatTimeAgo(allPhotos[0].timestamp);
            }
        }

        function formatTimeAgo(timestamp) {
            var seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            var minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ago';
            var hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            var days = Math.floor(hours / 24);
            return days + 'd ago';
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(c) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
            });
        }

        // ===== UPLOAD MODAL =====
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Remember guest name in session
            var savedName = sessionStorage.getItem('livewall_guest_name');
            if (savedName) document.getElementById('guestName').value = savedName;
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            clearPreview();
            document.getElementById('captionText').value = '';
        }

        function handleFileSelect(event) {
            var file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file', 'error');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                showToast('File too large (max 10MB)', 'error');
                return;
            }

            currentFile = file;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('previewContainer').classList.add('active');
                document.getElementById('dropZone').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function clearPreview() {
            currentFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').classList.remove('active');
            document.getElementById('dropZone').style.display = 'block';
        }

        // Drag and drop
        var dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(function(evt) {
            dropZone.addEventListener(evt, function(e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(function(evt) {
            dropZone.addEventListener(evt, function(e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            });
        });
        dropZone.addEventListener('drop', function(e) {
            var files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                handleFileSelect({ target: { files: files } });
            }
        });

        // ===== UPLOAD =====
        function uploadPhoto() {
            var guestName = document.getElementById('guestName').value.trim();
            var caption = document.getElementById('captionText').value.trim();

            if (!currentFile) { showToast('Please select a photo', 'error'); return; }
            if (!guestName) { showToast('Please enter your name', 'error'); return; }

            sessionStorage.setItem('livewall_guest_name', guestName);

            var submitBtn = document.getElementById('submitBtn');
            var progressEl = document.getElementById('uploadProgress');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            progressEl.classList.add('active');

            var reader = new FileReader();
            reader.onload = function(e) {
                var payload = {
                    action: 'upload',
                    imageData: e.target.result,
                    fileName: currentFile.name,
                    guestName: guestName,
                    caption: caption
                };

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                })
                .then(function() {
                    showToast('✓ Photo uploaded successfully!', 'success');
                    closeUploadModal();
                    // Wait a moment for Drive to process, then refresh
                    setTimeout(loadPhotos, 3000);
                })
                .catch(function(err) {
                    showToast('Upload failed: ' + err.message, 'error');
                })
                .finally(function() {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Share Photo';
                    progressEl.classList.remove('active');
                });
            };
            reader.readAsDataURL(currentFile);
        }

        // ===== UPDATE LIGHTBOX =====
        function openLightbox(photoId) {
            var photo = allPhotos.find(function(p) { return p.id === photoId; });
            if (!photo) return;

            currentLightboxPhoto = photo;

            document.getElementById('lightboxImg').src = photo.fullUrl;
            document.getElementById('lightboxCaption').textContent = photo.caption || '';
            document.getElementById('lightboxCaption').style.display = photo.caption ? 'block' : 'none';
            document.getElementById('lightboxMeta').textContent = '📸 ' + photo.guestName + ' · ' + formatTimeAgo(photo.timestamp);

            var heartBtn = document.getElementById('lightboxHeartBtn');
            var heartCount = document.getElementById('lightboxHeartCount');
            heartBtn.classList.toggle('heart-active', photo.userReacted);
            heartCount.textContent = photo.reactions;

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            if (e && e.target && !e.target.classList.contains('lightbox') && !e.target.classList.contains('lightbox-close')) return;
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
            currentLightboxPhoto = null;
        }

        function toggleLightboxReaction(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            if (!currentLightboxPhoto) return;

            var photoId = currentLightboxPhoto.id;
            var photo = allPhotos.find(function(p) { return p.id === photoId; });
            if (!photo) return;

            var wasReacted = photo.userReacted;
            var newAction = wasReacted ? 'remove' : 'add';

            // Optimistic UI update
            photo.userReacted = !wasReacted;
            photo.reactions += wasReacted ? -1 : 1;
            currentLightboxPhoto = photo;

            // Update lightbox UI immediately
            var heartBtn = document.getElementById('lightboxHeartBtn');
            var heartCount = document.getElementById('lightboxHeartCount');

            if (heartBtn) {
                heartBtn.classList.toggle('heart-active', photo.userReacted);
            }
            if (heartCount) {
                heartCount.textContent = photo.reactions;
            }

            // Update grid photo cards
            document.querySelectorAll('[data-photo-id="' + photoId + '"] .heart-btn').forEach(function(btn) {
                btn.classList.toggle('reacted', photo.userReacted);
                var countEl = btn.querySelector('.heart-count');
                if (countEl) countEl.textContent = photo.reactions;
            });

            // Update spotlight
            renderSpotlight();

            // Show floating heart animation
            if (!wasReacted && event) {
                var rect = heartBtn.getBoundingClientRect();
                showFloatingHeart(rect.left + rect.width / 2, rect.top);
            }

            // Send to server
            var payload = {
                action: 'react',
                photoId: photoId,
                reactorId: REACTOR_ID,
                reactionAction: newAction
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            }).catch(function(err) {
                console.error('Reaction error:', err);
                // Rollback on error
                photo.userReacted = wasReacted;
                photo.reactions += wasReacted ? 1 : -1;
                currentLightboxPhoto = photo;

                if (heartBtn) heartBtn.classList.toggle('heart-active', photo.userReacted);
                if (heartCount) heartCount.textContent = photo.reactions;

                showToast('Failed to react', 'error');
            });
        }

        // ===== TOAST =====
        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || '');
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        // Close upload modal on backdrop click
        document.getElementById('uploadModal').addEventListener('click', function(e) {
            if (e.target === this) closeUploadModal();
        });

        // ===== REFRESH COUNTDOWN =====
        var countdownSeconds = 60;
        var countdownTimer = null;

        function startRefreshCountdown() {
            countdownSeconds = 60;
            updateCountdownDisplay();

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(function() {
                countdownSeconds--;

                if (countdownSeconds <= 0) {
                    countdownSeconds = 60;
                    refreshPhotos();
                }

                updateCountdownDisplay();
            }, 1000);
        }

        function updateCountdownDisplay() {
            var el = document.getElementById('refreshCountdown');
            if (el) el.textContent = countdownSeconds;

            // Change color as time gets closer to refresh
            var indicator = document.getElementById('refreshIndicator');
            if (indicator) {
                if (countdownSeconds <= 5) {
                    indicator.style.background = 'rgba(76, 175, 80, 0.15)';
                    indicator.style.borderColor = 'rgba(76, 175, 80, 0.3)';
                    indicator.style.color = '#4CAF50';
                } else {
                    indicator.style.background = 'rgba(107, 154, 196, 0.1)';
                    indicator.style.borderColor = 'rgba(107, 154, 196, 0.2)';
                    indicator.style.color = '#6B9AC4';
                }
            }
        }

        function refreshPhotos() {
            var indicator = document.getElementById('refreshIndicator');
            if (indicator) {
                indicator.classList.add('refreshing');
                var textSpan = indicator.querySelector('span:last-child');
                var originalHTML = textSpan.innerHTML;
                textSpan.textContent = 'Refreshing...';

                loadPhotos();

                setTimeout(function() {
                    indicator.classList.remove('refreshing');
                    textSpan.innerHTML = 'Refreshing in <span class="refresh-countdown" id="refreshCountdown">60</span>s';
                    countdownSeconds = 60;
                    updateCountdownDisplay();
                }, 2000);
            } else {
                loadPhotos();
            }
        }

        // ===== INIT =====
        loadPhotos();
        startRefreshCountdown();

        // Update time labels every 30 seconds
        setInterval(function() {
            if (allPhotos.length > 0) updateStats();
        }, 30000);

        // Manual refresh when tab becomes active
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                refreshPhotos();
            }
        });

        // ===== ATTACH LIGHTBOX BUTTON HANDLERS =====
        document.addEventListener('DOMContentLoaded', function() {
            var heartBtn = document.getElementById('lightboxHeartBtn');
            var downloadBtn = document.getElementById('lightboxDownloadBtn');

            if (heartBtn) {
                heartBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleLightboxReaction(e);
                });
            }

            if (downloadBtn) {
                downloadBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    downloadPhotoFromLightbox(e);
                });
            }
        });
    </script>
</body>
</html>
